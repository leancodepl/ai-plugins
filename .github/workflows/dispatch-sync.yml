name: Notify internal sync

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch public-updated to internal
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INTERNAL_DISPATCH_TOKEN }}
          repository: leancodepl/ai-plugins-internal
          event-type: public-updated
          client-payload: |
            {"ref": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}
